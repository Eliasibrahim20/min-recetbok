<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#212121">
  <title>SmartAI</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#212121;color:#ececec}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#212121}
    button,textarea{font:inherit}
    button{cursor:pointer}
    .layout{display:flex;min-height:100vh}
    .sidebar{width:260px;background:#171717;padding:14px 12px;display:flex;flex-direction:column;gap:14px;flex-shrink:0}
    .brand{display:flex;align-items:center;gap:10px;padding:8px 9px;font-weight:700;font-size:18px}
    .brand-mark{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#4d8bff,#9a59ed);display:grid;place-items:center}
    .new-chat{background:transparent;color:#eee;border:1px solid #454545;border-radius:10px;padding:11px;text-align:left}
    .new-chat:hover,.history-item:hover{background:#292929}
    .history-title{font-size:12px;color:#999;padding:12px 9px 4px}
    .history{overflow:auto;display:flex;flex-direction:column;gap:4px}
    .history-item{background:transparent;border:0;color:#ddd;text-align:left;border-radius:8px;padding:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .side-note{margin-top:auto;color:#858585;font-size:12px;line-height:1.5;padding:9px}
    .main{min-width:0;flex:1;display:flex;flex-direction:column;min-height:100vh}
    .topbar{height:58px;display:flex;align-items:center;gap:12px;padding:0 22px;border-bottom:1px solid #333}.account-actions{margin-left:auto;display:flex;gap:8px;align-items:center}.account-actions button{border:1px solid #555;background:#303030;color:#eee;border-radius:9px;padding:8px 12px}.account-email{font-size:12px;color:#bbb}.auth-screen{position:fixed;inset:0;background:#171717;z-index:20;display:grid;place-items:center;padding:20px}.auth-card{width:min(100%,420px);background:#252525;border:1px solid #444;border-radius:18px;padding:26px}.auth-card h1{font-size:27px;margin:0 0 8px}.auth-card p{color:#aaa;line-height:1.5}.auth-card input{width:100%;padding:13px;margin:7px 0;background:#171717;border:1px solid #555;border-radius:9px;color:#fff}.auth-card button{width:100%;padding:12px;margin-top:9px;border:0;border-radius:9px;background:#eee;color:#171717;font-weight:700}.auth-card .secondary{background:transparent;color:#ddd;border:1px solid #555}.auth-error{color:#ff9b9b;font-size:13px;min-height:18px}.hidden{display:none!important}
    .mobile-brand{font-weight:650}
    .menu{display:none;background:transparent;color:#eee;border:0;font-size:21px}
    #chat{width:min(100%,820px);margin:0 auto;flex:1;padding:32px 24px 18px;display:flex;flex-direction:column;gap:24px}
    .welcome{margin:auto;text-align:center;width:100%;padding:40px 0}
    .welcome h1{font-size:clamp(27px,4vw,36px);font-weight:600;margin:0 0 26px}
    .suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:620px;margin:0 auto}
    .suggestion{background:#2b2b2b;color:#ddd;border:1px solid #414141;border-radius:13px;padding:14px;text-align:left;line-height:1.4}
    .suggestion:hover{background:#353535}
    .message{display:flex;gap:12px;align-items:flex-start;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
    .avatar{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-size:14px}
    .avatar.user{background:#555}.avatar.ai{background:linear-gradient(135deg,#4d8bff,#9a59ed)}
    .message-body{flex:1;padding-top:3px;min-width:0}
    .message-body p{margin:0 0 12px}
    .message-actions{display:flex;gap:8px;margin-top:8px}
    .small-action{background:transparent;border:0;color:#999;padding:4px 6px;border-radius:6px;font-size:12px}
    .small-action:hover{background:#333;color:#eee}
    .composer-wrap{width:min(100%,820px);margin:0 auto;padding:12px 24px 24px}
    .composer{display:flex;align-items:flex-end;gap:10px;background:#2f2f2f;border:1px solid #4b4b4b;border-radius:25px;padding:10px 12px 10px 18px;box-shadow:0 8px 28px #0002}
    .composer:focus-within{border-color:#777}
    textarea{flex:1;resize:none;max-height:180px;min-height:28px;border:0;outline:0;background:transparent;color:#eee;padding:7px 0;line-height:1.5}
    textarea::placeholder{color:#999}
    .send{width:38px;height:38px;border:0;border-radius:50%;background:#eee;color:#171717;font-size:19px;font-weight:700;display:grid;place-items:center}
    .send:disabled{opacity:.4;cursor:not-allowed}
    .disclaimer{text-align:center;color:#888;font-size:11px;padding-top:10px}
    .tool-btn{width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:#ddd;font-size:20px;display:grid;place-items:center}
    .tool-btn:hover{background:#444}.tool-btn.active{color:#8ab4ff}
    .attachment{display:none;align-items:center;gap:8px;color:#bbb;font-size:12px;padding:8px 14px}
    .attachment.show{display:flex}.attachment img{width:48px;height:48px;object-fit:cover;border-radius:8px}
    .attachment button{background:transparent;border:0;color:#ddd}
    .typing{color:#aaa}
    @media(max-width:700px){.sidebar{display:none;position:fixed;z-index:5;inset:0 auto 0 0;width:280px;box-shadow:0 0 0 100vmax #0008}.sidebar.open{display:flex}.menu{display:block}.topbar{padding:0 14px}#chat{padding:24px 16px 12px}.composer-wrap{padding:10px 12px 18px}.suggestions{grid-template-columns:1fr}.welcome{padding:20px 0}.welcome h1{margin-bottom:20px}}
  </style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><span class="brand-mark">✦</span> SmartAI</div>
    <button class="new-chat" id="newChat">＋　Ny chatt</button>
    <div class="history-title">Tidigare chattar</div>
    <div class="history" id="history"></div>
    <div class="side-note">SmartAI kan göra misstag. Kontrollera viktig information.</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <button class="menu" id="menu" aria-label="Öppna meny">☰</button>
      <div class="mobile-brand">SmartAI</div><div class="account-actions"><span class="account-email" id="accountEmail"></span><button id="logoutBtn" class="hidden" type="button">Logga ut</button></div>
    </div>
    <section id="chat" aria-live="polite">
      <div class="welcome" id="welcome">
        <h1>Vad kan jag hjälpa dig med?</h1>
        <div class="suggestions">
          <button class="suggestion">Förklara något svårt på ett enkelt sätt</button>
          <button class="suggestion">Hjälp mig komma på en bra idé</button>
          <button class="suggestion">Skriv eller förbättra en text</button>
          <button class="suggestion">Hjälp mig planera min dag</button>
        </div>
      </div>
    </section>
    <div class="composer-wrap">
      <div class="attachment" id="attachmentPreview"><img id="previewImage" alt="Vald bild"><span id="previewName"></span><button type="button" id="removeImage">✕</button></div>
      <form class="composer" id="form">
        <input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
        <button class="tool-btn" id="addImage" type="button" title="Bifoga bild">＋</button>
        <textarea id="message" placeholder="Fråga SmartAI" rows="1"></textarea>
        <button class="tool-btn" id="mic" type="button" title="Prata">🎙</button>
        <button class="send" id="send" type="submit" aria-label="Skicka">↑</button>
      </form>
      <div class="disclaimer">SmartAI använder Gemini. Skriv inte känsliga eller privata uppgifter.</div>
    </div>
  </main>
</div>
<div class="auth-screen" id="authScreen"><div class="auth-card"><h1>Välkommen till SmartAI</h1><p>Skapa ett konto eller logga in för att spara dina chattar.</p><input id="authEmail" type="email" autocomplete="email" placeholder="E-post"><input id="authPassword" type="password" autocomplete="current-password" placeholder="Lösenord"><div class="auth-error" id="authError"></div><button id="loginBtn" type="button">Logga in</button><button id="signupBtn" class="secondary" type="button">Skapa konto</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://dgkjfffoutoalwisqyoz.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_sAIf6M6qRqQrO4YZqhgIbg_pKOuZh-6";
  const FUNCTION_URL = "https://dgkjfffoutoalwisqyoz.supabase.co/functions/v1/hyper-responder";
  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);\n  let currentUser = null;
  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("message");
  const send = document.getElementById("send");
  const imageInput = document.getElementById("imageInput");
  const attachmentPreview = document.getElementById("attachmentPreview");
  const previewImage = document.getElementById("previewImage");
  const previewName = document.getElementById("previewName");
  let selectedImage = null;
  const historyEl = document.getElementById("history");
  const sidebar = document.getElementById("sidebar");
  let conversations = [];
  let activeId = null;
  let messages = [];

  async function loadChatsFromAccount() {
    if (!currentUser) return;
    const { data, error } = await db.from("smartai_chats").select("conversation_id,title,messages").eq("user_id", currentUser.id).order("updated_at", { ascending: false });
    if (error) throw error;
    conversations = (data || []).map(row => ({ id: row.conversation_id, title: row.title, messages: row.messages || [] }));
    renderHistory();
  }
  async function saveChats() {
    renderHistory();
    if (!currentUser || !activeId) return;
    const c = conversations.find(x => x.id === activeId);
    if (!c) return;
    const { error } = await db.from("smartai_chats").upsert({
      user_id: currentUser.id,
      conversation_id: c.id,
      title: c.title || "Ny chatt",
      messages: c.messages || [],
      updated_at: new Date().toISOString()
    }, { onConflict: "user_id,conversation_id" });
    if (error) console.error("Kunde inte spara chatten:", error);
  }
  function renderHistory() {
    historyEl.innerHTML = "";
    conversations.slice().reverse().forEach(c => {
      const b = document.createElement("button");
      b.className = "history-item";
      b.textContent = c.title || "Ny chatt";
      b.onclick = () => loadChat(c.id);
      historyEl.appendChild(b);
    });
  }
  function newChat() {
    activeId = Date.now().toString();
    messages = [];
    renderChat();
    sidebar.classList.remove("open");
    input.focus();
  }
  function loadChat(id) {
    const c = conversations.find(x => x.id === id);
    if (!c) return;
    activeId = c.id;
    messages = c.messages || [];
    renderChat();
    sidebar.classList.remove("open");
  }
  async function storeChat() {
    if (!activeId) activeId = Date.now().toString();
    let item = conversations.find(x => x.id === activeId);
    if (!item) {
      item = { id: activeId, title: messages.find(m => m.role === "user")?.text?.slice(0, 38) || "Ny chatt", messages: [] };
      conversations.push(item);
    }
    item.messages = messages;
    await saveChats();
  }
  function renderChat() {
    chat.innerHTML = "";
    if (!messages.length) {
      const w = document.createElement("div");
      w.className = "welcome";
      w.id = "welcome";
      w.innerHTML = '<h1>Vad kan jag hjälpa dig med?</h1><div class="suggestions"><button class="suggestion">Förklara något svårt på ett enkelt sätt</button><button class="suggestion">Hjälp mig komma på en bra idé</button><button class="suggestion">Skriv eller förbättra en text</button><button class="suggestion">Hjälp mig planera min dag</button></div>';
      chat.appendChild(w);
      w.querySelectorAll(".suggestion").forEach(b => b.addEventListener("click", () => { input.value = b.textContent; input.focus(); }));
      return;
    }
    messages.forEach((m, i) => addMessageElement(m, i));
  }
  function addMessageElement(m, index) {
    const row = document.createElement("div");
    row.className = "message";
    const avatar = document.createElement("div");
    avatar.className = "avatar " + (m.role === "user" ? "user" : "ai");
    avatar.textContent = m.role === "user" ? "Du" : "✦";
    const body = document.createElement("div");
    body.className = "message-body";
    const text = document.createElement("div");
    text.textContent = m.text;
    body.appendChild(text);
    if (m.role === "assistant" && m.text) {
      const actions = document.createElement("div");
      actions.className = "message-actions";
      const copy = document.createElement("button");
      copy.className = "small-action";
      copy.textContent = "Kopiera";
      copy.onclick = async () => { try { await navigator.clipboard.writeText(m.text); copy.textContent = "Kopierat"; } catch { copy.textContent = "Kunde inte kopiera"; } };
      actions.appendChild(copy);
      body.appendChild(actions);
    }
    row.append(avatar, body);
    chat.appendChild(row);
    return text;
  }
  function addMessage(text, role) {
    const m = { role, text };
    messages.push(m);
    const el = addMessageElement(m, messages.length - 1);
    chat.scrollTop = chat.scrollHeight;
    return el;
  }
  document.querySelectorAll(".suggestion").forEach(b => b.addEventListener("click", () => { input.value = b.textContent; input.focus(); }));
  document.getElementById("newChat").addEventListener("click", newChat);
  document.getElementById("menu").addEventListener("click", () => sidebar.classList.toggle("open"));
  input.addEventListener("input", () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 180) + "px"; });
  input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); } });
  document.getElementById("addImage").addEventListener("click", () => imageInput.click());
  imageInput.addEventListener("change", () => {
    const file = imageInput.files?.[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { alert("Bilden får vara högst 5 MB."); imageInput.value = ""; return; }
    const reader = new FileReader();
    reader.onload = () => {
      const url = String(reader.result || "");
      selectedImage = { mimeType: file.type, data: url.split(",")[1] || "" };
      previewImage.src = url; previewName.textContent = file.name; attachmentPreview.classList.add("show");
    };
    reader.readAsDataURL(file);
  });
  document.getElementById("removeImage").addEventListener("click", () => {
    selectedImage = null; imageInput.value = ""; previewImage.removeAttribute("src"); attachmentPreview.classList.remove("show");
  });

  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micButton = document.getElementById("mic");
  micButton.addEventListener("click", () => {
    if (!SpeechRecognition) { alert("Röstinmatning stöds inte i den här webbläsaren. Prova Chrome."); return; }
    const recognition = new SpeechRecognition();
    recognition.lang = "sv-SE"; recognition.interimResults = false;
    micButton.classList.add("active");
    recognition.onresult = e => {
      input.value = (input.value ? input.value + " " : "") + e.results[0][0].transcript;
      input.dispatchEvent(new Event("input")); input.focus();
    };
    recognition.onerror = () => alert("Kontrollera att webbläsaren får använda mikrofonen.");
    recognition.onend = () => micButton.classList.remove("active");
    try { recognition.start(); } catch { micButton.classList.remove("active"); }
  });

  form.addEventListener("submit", async event => {
    event.preventDefault();
    const message = input.value.trim();
    if ((!message && !selectedImage) || send.disabled) return;
    if (!messages.length) activeId = Date.now().toString();
    addMessage(message || "Titta på bilden.", "user");
    input.value = ""; input.style.height = "auto";
    send.disabled = true;
    const waiting = addMessage("SmartAI skriver…", "assistant");
    waiting.classList.add("typing");
    try {
      const history = messages.slice(0, -2)
        .filter(m => m.role === "user" || m.role === "assistant")
        .map(m => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.text }] }));
      const response = await fetch(FUNCTION_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_ANON_KEY,
          "Authorization": "Bearer " + SUPABASE_ANON_KEY
        },
        body: JSON.stringify({
          message: message || "Beskriv bilden.",
          history,
          image: selectedImage
        })
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Serverfel (" + response.status + ")");
      waiting.textContent = data.reply || "SmartAI skickade inget svar.";
      waiting.classList.remove("typing");
      if ("speechSynthesis" in window) {
        const utterance = new SpeechSynthesisUtterance(waiting.textContent);
        utterance.lang = "sv-SE";
        window.speechSynthesis.cancel();
        window.speechSynthesis.speak(utterance);
      }
      selectedImage = null; imageInput.value = ""; previewImage.removeAttribute("src"); attachmentPreview.classList.remove("show");
      messages[messages.length - 1].text = waiting.textContent;
      await storeChat(); chat.scrollTop = chat.scrollHeight;
    } catch (error) {
      waiting.textContent = "Kunde inte nå SmartAI: " + error.message;
      waiting.classList.remove("typing");
      messages[messages.length - 1].text = waiting.textContent;
    } finally {
      send.disabled = false; input.focus();
    }
  });
  const authScreen = document.getElementById("authScreen");
  const authError = document.getElementById("authError");
  const authEmail = document.getElementById("authEmail");
  const authPassword = document.getElementById("authPassword");
  async function enterAccount(user) {
    currentUser = user;
    document.getElementById("accountEmail").textContent = user.email || "";
    document.getElementById("logoutBtn").classList.remove("hidden");
    authScreen.classList.add("hidden");
    try { await loadChatsFromAccount(); renderChat(); }
    catch (e) { authError.textContent = "Kunde inte läsa chattar: " + e.message; }
  }
  document.getElementById("loginBtn").addEventListener("click", async () => {
    authError.textContent = "";
    const { data, error } = await db.auth.signInWithPassword({ email: authEmail.value.trim(), password: authPassword.value });
    if (error) { authError.textContent = error.message; return; }
    await enterAccount(data.user);
  });
  document.getElementById("signupBtn").addEventListener("click", async () => {
    authError.textContent = "";
    const { data, error } = await db.auth.signUp({ email: authEmail.value.trim(), password: authPassword.value, options: { emailRedirectTo: location.href.split("?")[0] } });
    if (error) { authError.textContent = error.message; return; }
    if (data.session) await enterAccount(data.user);
    else authError.textContent = "Kontot är skapat. Bekräfta e-posten och logga sedan in.";
  });
  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await db.auth.signOut();
    currentUser = null; conversations = []; messages = []; activeId = null;
    document.getElementById("accountEmail").textContent = "";
    document.getElementById("logoutBtn").classList.add("hidden");
    authScreen.classList.remove("hidden"); renderHistory(); renderChat();
  });
  db.auth.getSession().then(({ data, error }) => {
    if (error) authError.textContent = error.message;
    if (data.session?.user) enterAccount(data.session.user);
  });
  renderHistory();
  renderChat();
</script>
</body>
</html>
